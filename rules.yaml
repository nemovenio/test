version: 2

defaults:
  active: true
  requestTypes: all
  preprocessors: []
  exceptions: []

providers:
  test:
    urlPattern: '^https?:\/\/www\.pornhub\.com\/view\_video\.php\?viewkey\=([a-z0-9]*)'
    forceRedirection: true
    rules:
    - id: 'test'
        kind: raw
        match: '&pkey=([a-z0-9]*)'
        action:
          type: remove